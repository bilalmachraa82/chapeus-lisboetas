version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: chapeus2_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: chapeus_root_2024
      MYSQL_DATABASE: chapeus_wordpress
      MYSQL_USER: chapeus_user
      MYSQL_PASSWORD: chapeus_pass_2024
    volumes:
      - db2_data:/var/lib/mysql
    networks:
      - chapeus_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # WordPress
  wordpress:
    image: wordpress:latest
    container_name: chapeus2_wordpress
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: chapeus_wordpress
      WORDPRESS_DB_USER: chapeus_user
      WORDPRESS_DB_PASSWORD: chapeus_pass_2024
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8084');
        define('WP_SITEURL', 'http://localhost:8084');
        define('FS_METHOD', 'direct');
    volumes:
      - wordpress2_data:/var/www/html
      - ./processed_images:/var/www/html/wp-content/uploads/produtos
    ports:
      - "8084:80"
    networks:
      - chapeus_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # WP-CLI (para automação)
  wpcli:
    image: wordpress:cli
    container_name: chapeus2_wpcli
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress2_data:/var/www/html
      - ./setup-scripts:/scripts
    networks:
      - chapeus_network
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: chapeus_wordpress
      WORDPRESS_DB_USER: chapeus_user
      WORDPRESS_DB_PASSWORD: chapeus_pass_2024
    entrypoint: /bin/sh
    command: -c "sleep 30 && sh /scripts/setup-wordpress.sh"

  # phpMyAdmin (opcional - para debug)

volumes:
  db2_data:
  wordpress2_data:

networks:
  chapeus_network:
    driver: bridge
